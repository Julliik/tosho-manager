<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ТОШО!? CRM</title>
<meta name="apple-mobile-web-app-title" content="ТОШО CRM">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* Кольори, шрифти й кнопки як у клієнтському квізі. Тонкі суцільні рожеві рамки кнопок */
:root{
  --page:#0B0B0B; --bg:#121212; --card:#1B1B1B; --card2:#232323; --fg:#FFF9F8;
  --muted:rgba(255,249,248,.74); --soft:rgba(255,249,248,.58); --line:rgba(255,249,248,.16);
  --gold:#C5A880; --pink:#F8A4B8; --ink:#121212; --red:#FF8A8A; --green:#8FD19E; --yellow:#F2D27A; --blue:#9EC5F0;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --text:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--page)}
body{margin:0;color:var(--fg);font-family:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}  /* ярлик на робочому столі iPhone: сторінка заходить під рядок стану, відступаємо на його висоту */
@media (min-width:600px){.app{border-left:1px solid #222;border-right:1px solid #222}}
#view{flex:1;display:flex;flex-direction:column;transition:opacity .18s ease}
#view.fade{opacity:0}
@media (prefers-reduced-motion:reduce){#view{transition:none}}

/* Верхня панель і прогрес */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);min-height:56px;display:flex;align-items:center;gap:8px;padding:0 var(--gut) 0 max(6px,env(safe-area-inset-left,0px));border-bottom:1px solid transparent}
.top.line{border-bottom-color:#222}
.ib{width:44px;height:44px;flex:none;border:0;border-radius:12px;background:transparent;color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib:active{background:var(--card)}
.ib.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.bar i{height:4px;border-radius:2px;background:rgba(255,249,248,.15)}
.bar i.on{background:var(--gold)}
.count{min-width:34px;text-align:right;font:600 12px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.toptitle{flex:1;min-width:0;font:600 14px/1.2 var(--display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{height:26px;width:auto;margin-left:10px}
.sp44{width:44px;flex:none}

.body{flex:1;display:flex;flex-direction:column;gap:16px;padding:18px var(--gut) 28px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;text-wrap:balance}
h1{font-size:clamp(22px,6.6vw,28px);line-height:1.12}
h2{font-size:20px;line-height:1.18}
h3{font-size:13px;font-weight:600;line-height:1.2;color:var(--gold)}
h1:focus,h2:focus{outline:none}
.lead{margin:0;color:var(--muted)}
.small{margin:0;font-size:13px;line-height:1.45;color:var(--soft)}
.spacer{flex:1;min-height:4px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:0 20px;border:0;border-radius:999px;background:var(--fg);color:var(--ink);font:600 15px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;text-decoration:none;text-align:center;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.btn.pink{background:var(--pink)}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 18px;border:1px solid var(--pink);border-radius:999px;background:transparent;color:var(--fg);font:600 15px/1.2 var(--text);text-decoration:none;text-align:center;cursor:pointer}
.btn2:active,.chip:active,.opt:active,.item:active{transform:scale(.985)}
.link{align-self:center;padding:10px;border:0;background:none;color:var(--gold);font:500 14px var(--text);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dock{position:sticky;bottom:0;z-index:4;display:flex;flex-direction:column;gap:8px;padding:12px var(--gut) calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 78%,rgba(18,18,18,0))}

/* Поля */
.field{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:13px;color:var(--muted)}
.flabel b{color:var(--pink);font-weight:600}
input,textarea{width:100%;min-height:52px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);font:16px/1.4 var(--text)}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
input[aria-invalid="true"]{border-color:var(--pink)}
input[type="date"],input[type="time"]{color-scheme:dark;-webkit-appearance:none;appearance:none}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chips.c1{grid-template-columns:1fr}
.chips.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.chips.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.chips.scroll{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gut));padding:0 var(--gut) 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none;padding:0 14px}
.chip{min-height:48px;padding:6px 12px;border:1px solid var(--pink);border-radius:999px;background:transparent;color:var(--fg);font:600 14px/1.2 var(--text);cursor:pointer;text-align:center;transition:background .12s ease,color .12s ease}
.chips.c1 .chip{border-radius:14px;text-align:left;padding:10px 16px}
.chip[aria-pressed="true"]{background:var(--pink);color:var(--ink)}
.chip.sm{min-height:40px;font-size:13px}
.err{margin:0;font-size:13px;color:var(--pink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px}
.seg button{min-height:40px;border:0;border-radius:999px;background:transparent;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--fg)}

/* Програми з прайсу */
.grp{font-size:12px;color:var(--soft);margin:6px 2px -2px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:10px 16px;border:1px solid var(--pink);border-radius:14px;background:transparent;text-align:left;cursor:pointer}
.opt .t{font-weight:600}
.opt .p{flex:none;font:600 13px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{background:var(--pink);color:var(--ink)}
.opt[aria-pressed="true"] .p{color:var(--ink)}

/* Підказки під полями */
.note{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:var(--card);font-size:14px;line-height:1.4}
.note.warn{border:1px solid var(--pink)}
.note.ok{border:1px solid rgba(143,209,158,.5)}
.note.gold{border:1px solid rgba(197,168,128,.55)}
.note b{font-weight:600}
.note .act{align-self:flex-start;margin-top:2px;padding:8px 14px;border:1px solid var(--pink);border-radius:999px;background:transparent;font-weight:600;font-size:13px;cursor:pointer}
.mute{color:var(--soft)}

/* Список заявок */
.search{position:relative}
.search input{padding-left:44px;min-height:48px;border-radius:999px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--soft);pointer-events:none}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;flex-direction:column;gap:6px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;cursor:pointer}
.item .l1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.item .nm{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .no{flex:none;font:600 11px/1 var(--display);color:var(--soft)}
.item .l2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--muted)}
.st{display:inline-flex;align-items:center;min-height:22px;padding:2px 9px;border:1px solid currentColor;border-radius:999px;font-size:12px;font-weight:600;line-height:1.2;white-space:nowrap}
.s1{color:var(--pink)}.s2,.s3,.s4{color:var(--gold)}.s5{color:var(--yellow)}.s6{color:var(--green)}.s7{color:var(--blue)}.s8,.s9{color:var(--soft)}.s10,.sx{color:var(--red)}
.nc{font-size:12px;font-weight:600}
.nc.red{color:var(--red)}.nc.pink{color:var(--pink)}.nc.yellow{color:var(--yellow)}.nc.dim{color:var(--soft)}
.empty{padding:30px 10px;text-align:center;color:var(--soft)}
.stamp{font-size:12px;color:var(--soft);text-align:center}

/* Картка замовлення */
.hero{display:flex;flex-direction:column;gap:8px}
.hero .sub{color:var(--muted);font-size:14px}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.acts a,.acts button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:62px;border:1px solid var(--pink);border-radius:14px;background:transparent;color:var(--fg);font-size:12px;font-weight:600;text-decoration:none;cursor:pointer}
.box{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.box .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.box .ed{padding:6px 12px;border:1px solid var(--pink);border-radius:999px;background:transparent;font-size:13px;font-weight:600;cursor:pointer}
.kv{display:grid;grid-template-columns:minmax(96px,38%) 1fr;gap:6px 12px;margin:0;font-size:14px}
.kv dt{color:var(--soft)}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.kv dd.f{color:var(--gold)}
.todo{padding:12px 14px;border-radius:14px;background:rgba(197,168,128,.12);border:1px solid rgba(197,168,128,.45);font-size:14px}
.todo span{display:block;font-size:12px;color:var(--gold);margin-bottom:2px}

/* Повідомлення */
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:50;max-width:min(92vw,480px);padding:12px 18px;border-radius:14px;background:var(--fg);color:var(--ink);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fail{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--pink);border-radius:16px}
.fail p{margin:0;font-size:14px}
.sum{display:flex;flex-direction:column;gap:10px}
.done{align-items:center;text-align:center;justify-content:center}
.big{font:800 46px/1 var(--display);color:var(--gold)}
.pinbox{display:flex;flex-direction:column;gap:14px;margin-top:8vh}
.pinbox input{text-align:center;font:600 26px/1 var(--display);letter-spacing:.3em}
.load{display:flex;flex:1;align-items:center;justify-content:center;color:var(--soft)}

/* Нижнє меню */
.nav{position:sticky;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:8px var(--gut) calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid #222}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border:0;border-radius:14px;background:none;color:var(--soft);font-size:11px;font-weight:600;cursor:pointer}
.nav button[aria-current="page"]{color:var(--fg);background:var(--card)}
.nav button.plus{background:var(--pink);color:var(--ink)}

/* Сьогодні */
.cnt{flex:none;min-width:26px;padding:3px 8px;border-radius:999px;background:var(--card2);font:600 12px/1.2 var(--display);text-align:center;color:var(--gold)}
.task{display:flex;flex-direction:column;gap:4px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);text-align:left;cursor:pointer}
.task .l1{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.task .l2{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted)}
.task .cm{font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;background:var(--card)}
.stats b{font:800 22px/1 var(--display);color:var(--gold)}
.stats span{font-size:12px;line-height:1.3;color:var(--muted)}

/* Календар */
.calhd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--soft);text-align:center;padding:2px 0}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:46px;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);font:600 14px/1 var(--text);cursor:pointer}
.day.out{visibility:hidden}
.day.past{color:var(--soft)}
.day.d6{background:rgba(143,209,158,.18);border-color:rgba(143,209,158,.7)}
.day.d5{background:rgba(242,210,122,.14);border-color:rgba(242,210,122,.7)}
.day.now{box-shadow:inset 0 0 0 2px var(--gold)}
.day[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:var(--ink)}
.day small{font-size:10px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Синхронізація, швидкі дії, шаблони, звіт */
.sync{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.sync.bad{border-color:var(--red);color:var(--red)}
.task{position:relative}
.task .open{display:flex;flex-direction:column;gap:4px;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.qa button{min-height:36px;padding:0 12px;border:1px solid var(--pink);border-radius:999px;background:transparent;font-size:13px;font-weight:600;cursor:pointer}
.qa button.done{border-color:var(--line);color:var(--soft)}
.tplta{min-height:260px;font-size:15px;line-height:1.5}
.ph{color:var(--yellow)}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi div{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;background:var(--card)}
.kpi b{font:800 22px/1.05 var(--display);color:var(--gold)}
.kpi span{font-size:12px;line-height:1.3;color:var(--muted)}
.kpi small{font-size:11px;color:var(--soft)}
.bars{display:flex;flex-direction:column;gap:6px;font-size:13px}
.bars .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.bars .b{grid-column:1/-1;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.bars .b i{display:block;height:100%;background:var(--pink)}

/* Картка для команди */
.kart{margin:0;padding:14px;border-radius:16px;background:var(--card);font:15px/1.5 var(--text);white-space:pre-wrap;word-break:break-word}
.fsec{display:flex;flex-direction:column;gap:10px}
.fsec .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ftask{display:flex;flex-direction:column;gap:7px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.ftask.flag{border-color:rgba(158,197,240,.55)}
.ftask .l1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ftask .nm{min-width:0;padding:0;border:0;background:none;font-weight:600;font-size:15px;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ftask .no{flex:none;font:600 11px/1 var(--display);color:var(--soft)}
.ftask .stp{font-weight:700;font-size:17px;line-height:1.25}
.ftask .wh{font-size:13px;line-height:1.4;color:var(--muted)}
.ftask .l2,.stepbox .l2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--muted)}
.ftask .cm{font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flagtxt{font-size:13px;color:var(--blue)}
.whotag{font-size:12px;font-weight:600;color:var(--blue)}
.fa{display:grid;grid-template-columns:1.25fr 1fr 44px;gap:6px;margin-top:2px}
.fa button{min-height:42px;padding:0 10px;border:1px solid var(--pink);border-radius:999px;background:transparent;font-weight:600;font-size:13px;line-height:1.15;cursor:pointer}
.fa button.main{background:var(--pink);color:var(--ink)}
.fa button.more{padding:0;font-size:18px}
.fwait{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.fwait summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;cursor:pointer;list-style:none}
.fwait summary::-webkit-details-marker{display:none}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.wrow .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .d{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}
.wrow .s{grid-column:1/-1;font-size:12px;color:var(--soft)}
.stepbox{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:rgba(248,164,184,.08);border:1px solid rgba(248,164,184,.45)}
.stepbox .k{font:600 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--pink)}
.stepbox b{font-size:17px}
.stepbox>span{font-size:14px;color:var(--muted)}
.fmsg{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.fmsg .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--soft)}
.fmsg p{margin:0;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.45;user-select:text;-webkit-user-select:text}
.fmsg.media{border-style:dashed;border-color:rgba(197,168,128,.6)}
.fmsg.media p{color:var(--gold);font-size:14px}
.hole{color:var(--pink);font-weight:600}
.mcopy{min-height:34px;padding:0 14px;border:1px solid var(--pink);border-radius:999px;background:transparent;font-size:13px;font-weight:600;cursor:pointer}
.mcopy.ok{border-color:var(--green);color:var(--green)}
.then{padding:10px 14px;border-radius:14px;border:1px dashed rgba(197,168,128,.6);font-size:13px;color:var(--gold)}
.then b{font-weight:600;margin-right:4px}
.opts{display:flex;flex-direction:column;gap:8px}

<script>
/* ====== НАЛАШТУВАННЯ ====== */
const CONFIG = {
  endpoint: 'https://script.google.com/macros/s/AKfycbxIAF93Esi0pIZAHZ-MFCNekx3zc0tq7BsMIOwTG9rNhPtwmePNmAyoCGjX4UPe2ZFoYw/exec',   // адреса вебзастосунку Apps Script «ТОШО CRM» (…/exec)

/* ====== ДОПОМІЖНЕ ====== */
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { const v = localStorage.getItem('tosho_' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('tosho_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('tosho_' + k); } catch (e) {} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const digits = s => String(s == null ? '' : s).replace(/\D/g, '');
const money = n => (n === '' || n == null || isNaN(n)) ? '' : Math.round(Number(n)).toLocaleString('uk-UA').replace(/ | /g, ' ');
const pad = n => String(n).padStart(2, '0');
const fmtD = d => pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
const parseD = s => { const m = String(s || '').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };
const isoToD = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3] + '.' + m[2] + '.' + m[1] : ''; };
const dToIso = s => { const d = parseD(s); return d ? d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) : ''; };
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (n) => { const d = today0(); d.setDate(d.getDate() + n); return fmtD(d); };
const daysTo = s => { const d = parseD(s); return d ? Math.round((d - today0()) / 86400000) : null; };
const dayWord = n => { const a = Math.abs(n) % 10, b = Math.abs(n) % 100; return (a === 1 && b !== 11) ? 'день' : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? 'дні' : 'днів'; };

// Телефон до 0XXXXXXXXX, як у скрипті таблиці. Нік лишаємо як є
function normPhone(v) {
  const s = String(v == null ? '' : v).trim();
  if (!s) return s;
  return s.split(/\s*[,;]\s*/).map(p => {
    if (/[a-zа-яіїєґ@_]/i.test(p)) return p;
    let d = p.replace(/\D/g, '');
    if (d.length === 12 && d.indexOf('380') === 0) d = '0' + d.slice(3);
    else if (d.length === 11 && d.indexOf('80') === 0) d = d.slice(1);
    else if (d.length === 9 && d[0] !== '0') d = '0' + d;
    return (d.length === 10 && d[0] === '0') ? d : p;
  }).join(', ');
}
const phones = s => String(s || '').split(/\s*[,;]\s*/).map(normPhone).filter(Boolean);

// Instagram зберігаємо в колонці «Контакт» як instagram.com/нік: так його переносить скрипт «Заявки → Клієнти»,
// а в таблиці це клікабельне посилання. На сайті це окреме поле й кнопка в картці
const INSTA_RE = /^(?:https?:\/\/)?(?:www\.)?instagram\.com\/([A-Za-z0-9._]+)\/?/i;
function normInsta(v) {
  let x = String(v || '').trim();
  const m = x.match(INSTA_RE);
  if (m) x = m[1];
  return x.replace(/^@/, '').replace(/[/?#].*$/, '').trim();
}
const instaOk = n => /^[A-Za-z0-9._]{1,30}$/.test(n);
function splitContact(c) {
  let insta = '';
  const other = String(c || '').split(/\s*[,;]\s*/).filter(Boolean).filter(p => {
    const m = p.match(INSTA_RE);
    if (m && !insta) { insta = m[1]; return false; }
    return true;
  });
  return { other: other.join(', '), insta };
}
function joinContact(other, insta) {
  const n = normInsta(insta);
  return [String(other || '').trim(), n ? 'instagram.com/' + n : ''].filter(Boolean).join(', ');
}

const ICON = {

  list: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  cal: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  insta: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>',
  next: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  team: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  report: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  gear: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',

};

/* ====== ДАНІ ====== */
const S = {
  pin: store.get('pin') || '',
  device: store.get('device') || (() => { const d = uid(); store.set('device', d); return d; })(),
  data: store.get('data'),     // останні завантажені дані таблиці (щоб сайт відкривався миттєво)
  loading: false,
  filter: 'work',
  q: '',
  who: store.get('who') || '',
  outbox: store.get('outbox') || [],      // зміни, які ще не дійшли до таблиці
  problems: store.get('problems') || [],  // зміни, які таблиця не прийняла
  me: store.get('me') || {},              // ім'я і реквізити менеджера для шаблонів (тільки на цьому пристрої)
  rep: 'week'
};

async function api(action, payload) {
  if (!CONFIG.endpoint) throw Object.assign(new Error('Сайт ще не підключено до таблиці (немає адреси скрипта)'), { code: 'config' });
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 40000);
  let res;
  try {
    res = await fetch(CONFIG.endpoint, {
      method: 'POST', redirect: 'follow', signal: ctrl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, pin: S.pin, device: S.device }, payload || {}))
    });
  } catch (e) {
    throw Object.assign(new Error(navigator.onLine === false ? 'Немає інтернету. Введене збережено на телефоні, спробуйте ще раз, коли з\'явиться зв\'язок' : 'Не вдалося зв\'язатися з таблицею. Перевірте інтернет і спробуйте ще раз'), { code: 'net' });
  } finally { clearTimeout(t); }
  let j;
  try { j = await res.json(); } catch (e) { throw Object.assign(new Error('Таблиця відповіла незрозуміло. Спробуйте ще раз'), { code: 'bad' }); }
  if (!j.ok) {
    if (j.code === 'pin') { S.pin = ''; store.del('pin'); }
    throw Object.assign(new Error(j.error || 'Помилка'), { code: j.code });
  }
  if (j.who && j.who !== S.who) { S.who = j.who; store.set('who', j.who); }
  return j;
}

async function load(silent) {
  if (S.loading) return;
  S.loading = true;
  const btn = $('#reload'); if (btn) btn.classList.add('spin');
  try {
    const d = await api('init');
    d.at = Date.now();
    S.data = d;
    store.set('data', d);
    S.outbox.forEach(applyLocal);   // зміни, що ще в черзі, не мають зникнути з екрана
    const typing = document.activeElement && document.activeElement.id === 'q';
    if (cur === 'list' && !typing) render(true);
    else if (cur === 'list') { const recs = allRecs(); $('#items').innerHTML = itemsHtml(recs, workRecs(recs)); }
    else if ((cur === 'card' && P.nomer) || ['today', 'cal', 'team', 'report'].includes(cur)) render(true);
  } catch (e) {
    if (e.code === 'pin' || e.code === 'locked') { go('pin', { msg: e.message }, true); return; }
    if (!silent || !S.data) toast(e.message, 5000);
  } finally {
    S.loading = false;
    const b = $('#reload'); if (b) b.classList.remove('spin');
  }
}

const H = () => (S.data && S.data.headers) || [];
const col = h => H().indexOf(h);
function rec(r) {   // рядок таблиці → { назва колонки: значення }
  const o = { _sheet: r.sheet, _row: r.row };
  H().forEach((h, i) => { o[h] = r.v[i] == null ? '' : String(r.v[i]); });
  const sc = splitContact(o['Контакт']);
  o._contact = sc.other; o._insta = sc.insta;
  // Старі записи: нік у коментарі «Instagram @нік»
  if (!o._insta) { const m = String(o['Коментар'] || '').match(/instagram\s*:?\s*@([A-Za-z0-9._]+)/i); if (m) o._insta = m[1]; }
  return o;
}
function allRecs() {
  if (!S.data) return [];
  return S.data.zayavky.map(r => rec(Object.assign({ sheet: 'Заявки' }, r)))
    .concat(S.data.klienty.map(r => rec(Object.assign({ sheet: 'Клієнти' }, r))));
}
function findRec(nomer) { return allRecs().find(o => Number(o['№']) === Number(nomer)); }
function putRow(sheet, row, v) {
  const n = Number(v[0]);
  ['zayavky', 'klienty'].forEach(k => { S.data[k] = S.data[k].filter(r => Number(r.v[0]) !== n); });
  const k = sheet === 'Клієнти' ? 'klienty' : 'zayavky';
  S.data[k].push({ row, v });
  S.data[k].sort((a, b) => a.row - b.row);
  store.set('data', S.data);
}
const numL = o => Number(o['№']) < 0 ? '…' : esc(o['№']);   // заявка ще йде в таблицю: № невідомий
const L = name => (S.data && S.data.lists && S.data.lists[name]) || [];
const CLOSED = ['8. Проведено', '10. Закрито', 'Помилково внесено'];
const PAY_ST = ['5. Очікує оплату', '6. Заброньовано'];
const stNum = s => { const n = parseInt(s, 10); return isNaN(n) ? 'x' : n; };
const stPill = s => s ? `<span class="st s${stNum(s)}">${esc(s)}</span>` : '<span class="st sx">без статусу</span>';

/* ====== ПОЛЯ ====== */
const F = {

  'Статус': { t: 'chips', list: 'Статус' },
  'Наступний контакт': { t: 'date', quick: [['Сьогодні', 0], ['Завтра', 1], ['Через 2 дні', 2], ['Через тиждень', 7]], reqIf: d => !CLOSED.includes(d['Статус'] || '1. Нова') },
  'Час контакту': { t: 'time', quick: ['10:00', '12:00', '14:00', '16:00', '18:00', '19:30'], when: d => !CLOSED.includes(d['Статус'] || '1. Нова') },
  'Час звернення': { t: 'time', rel: [['Щойно', 0], ['15 хв тому', 15], ['30 хв тому', 30], ['1 год тому', 60], ['2 год тому', 120], ['Учора ввечері', 'eve']], virt: 1 },
  'Час відповіді': { t: 'time', rel: [['Зараз', 0], ['5 хв тому', 5], ['15 хв тому', 15]], virt: 1 },
  'Причина відмови': { t: 'chips', list: 'Причина', when: d => d['Статус'] === '10. Закрито', reqIf: d => d['Статус'] === '10. Закрито' },
  'Коментар': { t: 'area', ph: 'На чому зупинилися: що надіслали, що чекаємо від клієнта' }
};
const isReq = (h, d) => { const f = F[h]; return !!(f && (f.req || (f.reqIf && f.reqIf(d)))); };
const visible = (h, d) => { const f = F[h]; return !f || !f.when || f.when(d); };

// Кроки нової заявки. Обов'язкові: Клієнт, Звернення, Що далі. Решту можна пропустити
const STEPS = [
  { k: 'client', t: 'Клієнт', f: ['Контакт', 'Instagram', "Ім'я клієнта"] },
  { k: 'source', t: 'Звернення', f: ['Канал', 'Джерело', 'Перейшов у месенджер', 'Дата звернення', 'Час звернення', 'Час відповіді'], jump: 1 },
  { k: 'kid', t: 'Іменинник', f: ['Іменинник', 'Вік', 'Стать'], opt: 1 },

let META = {};   // службове: тип контакту, автопідстановки, кілька допродажів

function fieldHtml(h) {
  const f = F[h] || { t: 'text' };
  const v = D[h] == null ? '' : String(D[h]);
  const id = 'f' + Math.abs(hash(h));
  let x = '';
  switch (f.t) {
    case 'chips': {
      let opts = L(f.list);
      if (v && !opts.includes(v)) opts = opts.concat([v]);
      const cls = f.cols === 1 ? 'c1' : f.cols === 3 ? 'c3' : f.cols === 5 ? 'c5' : '';
      x = `<div class="chips ${cls}" role="group" aria-label="${esc(h)}">${opts.map(o => `<button type="button" class="chip" data-f="${esc(h)}" data-v="${esc(o)}" aria-pressed="${o === v}">${esc(o)}</button>`).join('')}</div>`;
      break;
    }
    case 'multi': {
      const sel = META.multi || (v ? [v] : []);
      x = `<div class="chips" role="group" aria-label="${esc(h)}">${L(f.list).filter(o => o !== 'Кілька (у коментарі)').map(o => `<button type="button" class="chip" data-multi="${esc(h)}" data-v="${esc(o)}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join('')}</div>
        ${sel.length > 1 ? '<p class="small">У таблицю піде «Кілька (у коментарі)», перелік допишеться в коментар</p>' : ''}`;
      break;
    }
    case 'contact': {
      const nick = META.contactType === 'nick';
      x = `<div class="seg" role="group" aria-label="Тип контакту"><button type="button" data-ctype="phone" aria-pressed="${!nick}">Телефон</button><button type="button" data-ctype="nick" aria-pressed="${nick}">Нік</button></div>
        <input id="${id}" data-in="${esc(h)}" value="${esc(v)}" ${nick ? 'type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="@нік або посилання"' : 'type="tel" inputmode="tel" autocomplete="off" placeholder="0XX XXX XX XX"'}>
        <div id="info-contact">${contactInfo()}</div>`;
      break;
    }
    case 'insta': {
      x = `<input id="${id}" data-in="${esc(h)}" type="text" value="${esc(v)}" placeholder="@нік або посилання на профіль" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"><div id="info-insta">${instaInfo()}</div>`;
      break;
    }
    case 'date': {
      x = (f.quick ? `<div class="chips ${f.quick.length > 2 ? '' : ''}">${f.quick.map(([t, n]) => `<button type="button" class="chip sm" data-f="${esc(h)}" data-v="${addDays(n)}" aria-pressed="${v === addDays(n)}">${t}</button>`).join('')}</div>` : '')
        + `<input id="${id}" type="date" data-date="${esc(h)}" value="${dToIso(v)}">`
        + (f.info === 'party' ? `<div id="info-party">${partyInfo()}</div>` : '');
      break;
    }
    case 'time': {
      const plus = f.plus && D['Початок'] ? [['+1,5 год', 90], ['+3,5 год', 210]].map(([t, m]) => { const e = addMin(D['Початок'], m); return `<button type="button" class="chip sm" data-f="${esc(h)}" data-v="${e}" aria-pressed="${v === e}">${t} · ${e}</button>`; }).join('') : '';
      const quick = f.quick ? f.quick.map(t => `<button type="button" class="chip sm" data-f="${esc(h)}" data-v="${t}" aria-pressed="${v === t}">${t}</button>`).join('')
        : f.rel ? f.rel.map(([t, m]) => { const x = m === 'eve' ? '20:00' : agoHM(m); return `<button type="button" class="chip sm" data-f="${esc(h)}" data-v="${x}" aria-pressed="${v === x}">${t}</button>`; }).join('') : '';
      x = (plus || quick ? `<div class="chips ${quick ? 'c3' : ''}">${plus}${quick}</div>` : '') + `<input id="${id}" type="time" data-in="${esc(h)}" value="${esc(v)}">`;
      break;
    }
    case 'program': {
      const groups = [];
      (S.data ? S.data.price : []).forEach(p => {
        let g = groups.find(x => x.note === p.note);
        if (!g) groups.push(g = { note: p.note, items: [] });
        g.items.push(p);
      });
      x = groups.map(g => `<div class="grp">${esc(g.note)}</div>` + g.items.map(p => `<button type="button" class="opt" data-f="${esc(h)}" data-v="${esc(p.name)}" aria-pressed="${p.name === v}"><span class="t">${esc(p.name)}</span><span class="p">${p.price ? money(p.price) : ''}</span></button>`).join('')).join('');
      if (v && !(S.data.price || []).some(p => p.name === v)) x = `<button type="button" class="opt" aria-pressed="true"><span class="t">${esc(v)}</span></button>` + x;
      break;
    }
    case 'num': case 'money':
      x = `<input id="${id}" data-in="${esc(h)}" inputmode="numeric" value="${esc(f.t === 'money' ? money(digits(v)) : digits(v))}" placeholder="${esc(f.ph || '')}">` + (f.info === 'check' ? `<div id="info-check">${checkInfo()}</div>` : '');
      break;
    case 'area':
      x = `<textarea id="${id}" data-in="${esc(h)}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
      break;
    default:
      x = `<input id="${id}" data-in="${esc(h)}" type="text" value="${esc(v)}" placeholder="${esc(f.ph || '')}" autocomplete="off">`;
  }
  return `<div class="field" data-field="${esc(h)}"><label class="flabel" for="${id}">${esc(h)}${isReq(h, D) ? ' <b>*</b>' : ''}</label>${x}<p class="err" hidden></p></div>`;
}
function agoHM(m) { const d = new Date(Date.now() - m * 60000); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }
function addMin(t, m) {
  const x = String(t).match(/^(\d{1,2}):(\d{2})/); if (!x) return '';
  const tot = (+x[1] * 60 + +x[2] + m) % 1440;
  return pad(Math.floor(tot / 60)) + ':' + pad(tot % 60);
}

function instaInfo() {
  const n = normInsta(D['Instagram']);
  if (!n) return '';
  return instaOk(n) ? `<p class="small">Посилання в картці: instagram.com/${esc(n)}</p>` : '<p class="err">Схоже, це не нік Instagram. Потрібні латинські літери, цифри, крапка або _</p>';
}
// Контакти поточної форми для пошуку дублів: телефони/нік + Instagram
function myContacts() {
  const ins = normInsta(D['Instagram']);
  return phones(D['Контакт']).concat(ins ? ['instagram.com/' + ins] : [])
    .map(p => p.toLowerCase().replace(/^@/, '')).filter(p => p.length >= 4);
}
const recContacts = o => phones(o['Контакт']).map(p => p.toLowerCase().replace(/^@/, ''));

// Повторний клієнт і дубль заявки
function contactInfo() {
  const c = String(D['Контакт'] || '').trim();
  const mine = myContacts();
  if (!mine.length) return '';
  const self = Number(D['№'] || 0);
  const hits = allRecs().filter(o => Number(o['№']) !== self && recContacts(o).some(p => mine.includes(p)));
  const bad = c && META.contactType !== 'nick' && phones(c).some(p => !/^0\d{9}$/.test(p));
  let out = bad ? '<p class="err">Номер не схожий на український 0XXXXXXXXX. Перевірте або перемкніть на «Нік»</p>' : '';
  if (!hits.length) return out;
  const active = hits.filter(o => o._sheet === 'Заявки' && !CLOSED.includes(o['Статус']));
  const past = hits.filter(o => !active.includes(o)).sort((a, b) => (parseD(b['Дата свята']) || 0) - (parseD(a['Дата свята']) || 0));
  if (active.length) {
    const o = active[0];
    out += `<div class="note warn"><b>Цей контакт уже в роботі: №${numL(o)}</b><span>${esc(o["Ім'я клієнта"] || 'Без імені')} · ${esc(o['Статус'] || 'без статусу')}${o['Дата свята'] ? ' · свято ' + esc(o['Дата свята']) : ''}</span><span class="mute">Можливо, нова заявка не потрібна, а треба оновити наявну.</span><button type="button" class="act" data-open="${esc(o['№'])}">Відкрити №${numL(o)}</button></div>`;
  }
  if (past.length) {
    const o = past[0];
    out += `<div class="note ok"><b>Повторний клієнт</b><span>${esc(o["Ім'я клієнта"] || 'Без імені')}${o['Дата свята'] ? ' · останнє свято ' + esc(o['Дата свята']) : ''}${o['Іменинник'] ? ' · ' + esc(o['Іменинник']) : ''} (№${numL(o)})</span></div>`;
  }
  return out;
}

// Брони на дату свята (статуси 5 і 6) і скільки днів до свята
function partyInfo() {
  const v = D['Дата свята'];
  if (!parseD(v)) return '';
  const n = daysTo(v);
  const when = n === 0 ? 'Свято сьогодні' : n === 1 ? 'Свято завтра' : n > 0 ? `До свята ${n} ${dayWord(n)}` : `Дата минула ${-n} ${dayWord(n)} тому`;
  const self = Number(D['№'] || 0);
  const b = allRecs().filter(o => o['Дата свята'] === v && PAY_ST.includes(o['Статус']) && Number(o['№']) !== self);
  let out = `<p class="small">${when}</p>`;
  if (b.length) {
    const turnkey = b.some(o => o['Формат'] === 'Під ключ');
    out += `<div class="note warn"><b>На цю дату вже є ${b.length === 1 ? 'бронь' : 'брони: ' + b.length}</b>${b.map(o => `<span>${esc((o['Початок'] || '?') + (o['Кінець'] ? '–' + o['Кінець'] : ''))} · ${esc(o["Ім'я клієнта"] || o['Іменинник'] || 'Без імені')} · ${esc(o['Статус'])}${o['Програма'] ? ' · ' + esc(o['Програма']) : ''}</span>`).join('')}${turnkey ? '<span class="mute">Є свято під ключ: команда проводить одне таке на день.</span>' : ''}</div>`;
  } else {
    out += '<div class="note ok"><span>Броней на цю дату немає</span></div>';
  }
  return out;
}

// Підказка мінімальної передоплати (таблиця порахує сама)
function checkInfo() {
  const c = Number(digits(D['Чек, грн']));
  if (!c) return '';
  const tk = D['Формат'] === 'Під ключ' || D['Програма'] === 'Під ключ';
  const m = tk ? c * 0.5 : Math.min(c, Math.max(c * 0.3, 3000));
  return `<p class="small">Мінімальна передоплата ≈ ${money(m)} грн (${tk ? 'під ключ 50%' : 'стандарт 30%, не менше 3 000'})</p>`;
}

// Повторний клієнт (є в архіві або закрите замовлення): підставляємо ім'я і джерело «Повторний».
// Якщо контакт змінили, підстановки прибираємо. Тільки для нової заявки
function onContactRepeat() {
  if (P.mode !== 'new') return;
  const A = META.auto || {};
  if (A.name && D["Ім'я клієнта"] === A.name) D["Ім'я клієнта"] = '';
  if (A.src && D['Джерело'] === A.src) D['Джерело'] = '';
  META.auto = {};
  const mine = myContacts();
  if (!mine.length) return;
  const past = allRecs().filter(o => (o._sheet === 'Клієнти' || CLOSED.includes(o['Статус'])) && recContacts(o).some(p => mine.includes(p)));
  if (past.length) {
    const o = past.find(o => o["Ім'я клієнта"]);
    if (o && !D["Ім'я клієнта"]) { D["Ім'я клієнта"] = o["Ім'я клієнта"]; META.auto.name = o["Ім'я клієнта"]; }
    if (!D['Джерело'] && L('Джерело').includes('Повторний')) { D['Джерело'] = 'Повторний'; META.auto.src = 'Повторний'; }

}
function clearErr(h) {
  const box = document.querySelector(`[data-field="${CSS.escape(h)}"] .err`);
  if (box && !box.hidden) { box.hidden = true; box.textContent = ''; }
}

function validate(fields) {
  let first = null;
  fields.forEach(h => {
    if (!visible(h, D)) return;
    const box = document.querySelector(`[data-field="${CSS.escape(h)}"] .err`);
    const miss = isReq(h, D) && !String(D[h] || '').trim();
    if (box) { box.hidden = !miss; box.textContent = miss ? 'Заповніть це поле' : ''; }
    if (miss && !first) first = h;
  });
  if (first) {
    const el = document.querySelector(`[data-field="${CSS.escape(first)}"]`);
    if (el) el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
  }
  return !first;
}

/* ====== ЕКРАНИ ====== */
let cur = '';
let P = {};
const STACK = [];
const R = {};

function go(name, params, replace) {
  if (replace) STACK.pop();
  STACK.push({ name, params: params || {} });
  try { history[replace ? 'replaceState' : 'pushState']({ n: STACK.length }, ''); } catch (e) {}
  show(name, params || {});
}
function back() {
  if (STACK.length > 1) { history.back(); return; }
  go('today', {}, true);
}
window.addEventListener('popstate', () => {
  if (STACK.length > 1) STACK.pop();
  const s = STACK[STACK.length - 1] || { name: 'today', params: {} };
  show(s.name, s.params);
});
function show(name, params) {
  const paint = () => {
    cur = name; P = params;
    view.innerHTML = R[name]();
    view.classList.remove('fade');
    window.scrollTo(0, 0);
    const h = view.querySelector('h1,h2'); if (h) h.focus({ preventScroll: true });
    if (AFTER[name]) AFTER[name]();
  };
  if (reduced || !view.innerHTML) return paint();
  view.classList.add('fade');
  setTimeout(paint, 160);
}
function render(keepScroll) {
  const y = window.scrollY;
  view.innerHTML = R[cur]();
  if (AFTER[cur]) AFTER[cur]();
  if (keepScroll) window.scrollTo(0, y);
}
const AFTER = {};

let toastT;
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms || 2600);
}

/* --- Список заявок --- */
function ncBadge(o) {
  if (o._sheet === 'Клієнти' || CLOSED.includes(o['Статус'])) return '';
  const v = o['Наступний контакт'];
  const n = daysTo(v);
  if (n === null) return '<span class="nc yellow">без дати контакту</span>';
  if (n < 0) return `<span class="nc red">контакт прострочено ${-n} ${dayWord(n)}</span>`;
  const tm = o['Час контакту'] ? ' о ' + esc(o['Час контакту']) : '';
  if (n === 0) return `<span class="nc pink">контакт сьогодні${tm}</span>`;
  if (n === 1) return `<span class="nc dim">контакт завтра${tm}</span>`;
  return `<span class="nc dim">контакт ${esc(v.slice(0, 5))}${tm}</span>`;
}
function workSort(a, b) {
  const k = o => { const n = daysTo(o['Наступний контакт']); if (n === null) return -0.5; const t = String(o['Час контакту'] || '').match(/^(\d{1,2}):(\d{2})/); return n + (t ? (+t[1] * 60 + +t[2]) / 1440 : 0.99); };
  const x = k(a), y = k(b);
  if (x !== y) return x - y;
  return Number(b['№']) - Number(a['№']);
}
function itemHtml(o) {
  const who = [o["Ім'я клієнта"] || 'Без імені', o['Іменинник'] ? o['Іменинник'] + (o['Вік'] ? ', ' + o['Вік'] : '') : ''].filter(Boolean).join(' · ');
  const party = o['Дата свята'] ? 'свято ' + o['Дата свята'].slice(0, 5) + (o['Початок'] ? ' ' + o['Початок'] : '') : '';
  return `<button type="button" class="item" data-open="${esc(o['№'])}">
    <span class="l1"><span class="nm">${esc(who)}</span><span class="no">№${numL(o)}${o._sheet === 'Клієнти' ? ' · архів' : ''}</span></span>
    <span class="l2">${stPill(o['Статус'])}${party ? `<span>${esc(party)}</span>` : ''}${o['Програма'] ? `<span>${esc(o['Програма'])}</span>` : ''}${ncBadge(o)}</span>

const rokiv = n => { const a = n % 10, b = n % 100; return (a === 1 && b !== 11) ? 'рік' : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? 'роки' : 'років'; };
const ditei = n => { const a = n % 10, b = n % 100; return (a === 1 && b !== 11) ? 'дитина' : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? 'дитини' : 'дітей'; };
function avtoProhrama(prog, guests, dop, rayon) {
  const out = [];
  String(prog || '').split(' + ').map(x => x.trim()).filter(Boolean).forEach(p => {
    if (p === 'МК') out.push('мк «…» — ' + (guests || '…') + ' учасників | 1,5 год');
    else if (/^Вгадай/.test(p)) out.push('гра «Вгадай що всередині!?» — 40-60 хв');
    else if (p === 'Під ключ' || p === 'Інше') out.push('…');
    else out.push('гра «' + p + '» — 1,5 год');
  });
  String(dop || '').split(',').map(x => x.trim()).filter(x => x && x !== 'Немає' && !/^Кілька/.test(x))
    .forEach(x => out.push(x.charAt(0).toLowerCase() + x.slice(1)));
  if (rayon === 'Київська область') out.push('трансфер команди');
  return out;
}
function kartka(o) {
  const d = h => String(o[h] || '').trim();
  const num = h => { const x = digits(d(h)); return x ? Number(x) : 0; };
  const fm = x => String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const missing = [];
  const lines = ['Ваше замовлення:'];
  const date = d('Дата свята').replace(/^(\d{2})\.(\d{2})\.\d{2}(\d{2})$/, '$1.$2.$3');
  if (!date) missing.push('Дата свята');
  let time = d('Початок');
  if (time && d('Кінець')) time += '-' + d('Кінець');
  else if (time) missing.push('Кінець');
  else missing.push('Початок');
  lines.push([date, time].filter(Boolean).join(' '));
  lines.push('');
  const who = d('Стать') === 'Дівчинка' ? 'Іменинниця' : 'Іменинник';
  let l = '📍' + who + ': ' + (d('Іменинник') || '…');
  const age = num('Вік'); if (age) l += ' ' + age + ' ' + rokiv(age);
  const guests = num('Гостей'); if (guests) l += ', ' + guests + ' ' + ditei(guests);
  const ga = d('Вік гостей'); if (ga) l += ', від ' + ga + (/рок|рік/.test(ga) ? '' : ' років');
  lines.push(l + '.');
  const adr = d('Адреса');
  if (!adr) missing.push('Адреса');
  lines.push('🔺Локація: ' + (adr || [d('Місце'), d('Район')].filter(Boolean).join(', ') || '…') + '.');
  lines.push('');
  lines.push('Програма:');
  let items = d('Склад програми')
    ? d('Склад програми').split(/\n+/).map(x => x.replace(/^[•\-\s]+/, '').trim()).filter(Boolean)
    : avtoProhrama(d('Програма'), guests, d('Допродажі'), d('Район'));
  if (!items.length) { items = ['…']; missing.push('Програма'); }
  items.forEach((x, i) => lines.push('• ' + x + (i === items.length - 1 ? '.' : '')));
  lines.push('');
  const chek = num('Чек, грн') ? fm(num('Чек, грн')) : '';
  const pre = num('Передоплата, грн');
  const rest = d('Залишок до оплати') !== '' ? fm(num('Залишок до оплати')) : '';
  if (!chek) missing.push('Чек');
  if (chek && pre > 0) lines.push('Разом: ' + chek + ' грн.-' + fm(pre) + ' грн.(п/о)=' + rest + ' грн.');
  else lines.push('Разом: ' + (chek ? chek + ' грн.' : 'уточнюється'));
  lines.push([d('Контакт'), d("Ім'я клієнта")].filter(Boolean).join(' '));
  return { text: lines.join('\n'), missing };
}

/* ====== ЧЕРГА ЗБЕРЕЖЕНЬ ======
   Зміна одразу видна на сайті, а в таблицю йде у фоні. Без інтернету чекає й повторює.
   Якщо таблиця не прийняла зміну, вона з'являється в «⚠» зверху */
function saveQueue() { store.set('outbox', S.outbox); store.set('problems', S.problems); const b = $('#syncbox'); if (b) b.innerHTML = syncHtml(); }
function enqueue(job) {
  job.id = job.id || uid();
  S.outbox.push(job);
  applyLocal(job);
  saveQueue();
  flush();
}
function setCell(o, h, v) {
  const r = (S.data[o._sheet === 'Клієнти' ? 'klienty' : 'zayavky'] || []).find(x => Number(x.v[0]) === Number(o['№']));
  const c = col(h);
  if (r && c > -1) r.v[c] = v;
}
function applyLocal(job) {
  if (!S.data) return;
  if (job.action === 'create') {
    if (S.data.zayavky.some(r => Number(r.v[0]) === job.temp)) return;
    const d = Object.assign({ 'Статус': '1. Нова', 'Дата звернення': addDays(0) }, job.data);
    const v = H().map(h => h === '№' ? String(job.temp) : d[h] === undefined ? '' : ['Чек, грн', 'Передоплата, грн'].includes(h) ? money(digits(d[h])) : String(d[h]));
    S.data.zayavky.push({ row: 0, v });
    return;
  }
  const o = findRec(job.nomer);
  if (!o) return;
  if (job.action === 'update') Object.keys(job.changes).forEach(h => {
    let v = job.changes[h].to;
    if (['Чек, грн', 'Передоплата, грн'].includes(h)) v = money(digits(v));
    setCell(o, h, v);
  });
  if (job.action === 'note') {
    if (job.text) {
      const d = new Date(job.at || Date.now());
      const line = pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + (S.who && S.who !== 'Команда' ? ' ' + S.who : '') + ': ' + job.text;
      if (!String(o['Коментар'] || '').includes(line)) setCell(o, 'Коментар', [o['Коментар'], line].filter(Boolean).join('\n'));
    }
    if (job.next !== undefined && job.next !== null) setCell(o, 'Наступний контакт', job.next);
    if (job.nextTime !== undefined && job.nextTime !== null) setCell(o, 'Час контакту', job.nextTime);
  }
}
let flushing = false, flushT = 0;
async function flush() {
  if (flushing || !S.outbox.length || !S.pin) return;
  flushing = true;
  let sent = 0;
  try {
    while (S.outbox.length) {
      const job = S.outbox[0];
      const payload = job.action === 'create' ? { id: job.id, data: job.data, meta: job.meta }
        : job.action === 'note'
        ? { id: job.id, sheet: job.sheet, nomer: job.nomer, text: job.text, next: job.next, nextTime: job.nextTime }
        : { id: job.id, sheet: job.sheet, nomer: job.nomer, changes: job.changes };
      let r;
      try { r = await api(job.action, payload); }
      catch (e) {
        if (['net', 'busy', 'bad', 'config'].includes(e.code)) { clearTimeout(flushT); flushT = setTimeout(flush, 20000); break; }
        if (e.code === 'pin' || e.code === 'locked') { go('pin', { msg: e.message }); break; }
        if (job.action === 'create') {
          S.data.zayavky = S.data.zayavky.filter(x => Number(x.v[0]) !== job.temp);
          S.problems.push({ nomer: '', label: 'нова заявка: ' + (job.label || ''), msg: e.message + '. Заявку можна відновити як чернетку', data: job.data, at: Date.now() });
        } else S.problems.push({ nomer: job.nomer, label: job.label || '', msg: e.message, at: Date.now() });
        S.outbox.shift(); saveQueue(); continue;
      }
      S.outbox.shift();
      sent++;
      if (job.action === 'create') {
        S.data.zayavky = S.data.zayavky.filter(x => Number(x.v[0]) !== job.temp);
        putRow('Заявки', r.row, r.v);
        STACK.forEach(x => { if (x.params && Number(x.params.nomer) === job.temp) x.params.nomer = r.nomer; });
        S.outbox.forEach(j => { if (Number(j.nomer) === job.temp) { j.nomer = r.nomer; j.sheet = 'Заявки'; } });   // нотатки, зроблені до появи №
        if (Number(P.nomer) === job.temp) { P.nomer = r.nomer; if (cur === 'done') P.rejected = r.rejected || []; }
        if (r.rejected && r.rejected.length && cur !== 'done') S.problems.push({ nomer: r.nomer, label: job.label || '', msg: 'Таблиця не прийняла: ' + r.rejected.map(x => x.field + ' «' + x.value + '»').join(', ') + '. Значення дописано в коментар' , at: Date.now() });
        if (cur !== 'done') toast('Заявку №' + r.nomer + ' записано в таблицю');
        saveQueue();
        if (['done', 'card', 'list', 'today'].includes(cur)) render(true);
        continue;
      }
      putRow(r.sheet, r.row, r.v);
      const msgs = [];
      (r.conflicts || []).forEach(c => msgs.push(`«${c.field}» хтось змінив у таблиці, там зараз: ${c.now || 'порожньо'}. Ваше значення не записано`));
      (r.rejected || []).forEach(c => msgs.push(`«${c.field}»: таблиця не прийняла «${c.value}»`));
      if (msgs.length) S.problems.push({ nomer: job.nomer, label: job.label || '', msg: msgs.join('. '), at: Date.now() });
      saveQueue();
    }
  } finally {
    flushing = false;
    saveQueue();
    if (sent && !S.outbox.length) setTimeout(() => load(true), 400);
    else if (sent && ['today', 'list', 'card', 'cal'].includes(cur)) render(true);
  }
}

  if (/ія$/i.test(n)) return n.slice(0, -1) + 'ї';
  if (/я$/i.test(n)) return n.slice(0, -1) + 'і';
  if (/[гкх]а$/i.test(n)) return n.slice(0, -1) + 'и';
  if (/а$/i.test(n)) return n.slice(0, -1) + 'и';

  later:     { label: 'Повернутись, як просила', sts: ['9. Відкладено'], what: 'Клієнтка просила написати пізніше. Пишемо одразу з програмою.', tpl: 'later', send: 'Надіслала', then: 'якщо мовчатиме, одне нагадування через тиждень',

               next: o => ({ step: 'close', in: 1, note: 'Надіслано: нагадування (П8.3)' }) },
  repeat:    { label: 'Повторний продаж', sts: ['8. Проведено'], what: 'За 6 тижнів до наступного дня народження. Спершу тепло, без пропозиції в лоб.', tpl: 'repeat6w', send: 'Надіслала', then: 'відповість — створіть нову заявку з джерелом «Повторний»',
               next: o => ({ step: 'repeatsent', noDate: 1, note: 'Надіслано: повторний продаж (П13)' }) },
  repeatsent:{ label: 'Повторний продаж надіслано', sts: ['8. Проведено'], what: '', noText: 1 },
  noreason:  { label: 'Записати причину відмови', sts: [NB], what: 'Заявку закрито без причини. Без причини «Звіт» не покаже, чому втрачаємо клієнтів.', noText: 1 }
};
const BY_LABEL = {}; Object.keys(FLOW).forEach(k => { FLOW[k].key = k; BY_LABEL[FLOW[k].label] = k; });
const hasStepCol = () => col('Крок') > -1;

// Крок і дата заявки. Якщо «Крок» порожній або не підходить до статусу (заявку вніс агент чи хтось змінив статус у таблиці),
// беремо крок за замовчуванням для статусу
function stepOf(o) {
  if (o['Статус'] === 'Помилково внесено') return null;
  const st = o['Статус'] || '';
  const stored = BY_LABEL[String(o['Крок'] || '').trim()];
  const nc = o['Наступний контакт'], tm = String(o['Час контакту'] || '');
  if (o._sheet === 'Клієнти') {
    const ak = parseD(o['Нагадати про ДН']);
    if (!ak || stored === 'repeatsent') return st === NB && !o['Причина відмови'] ? { key: 'noreason', due: addDays(0) } : null;
    const n = Math.round((ak - today0()) / 864e5);
    if (n > 0 || n < -14) return null;
    return { key: 'repeat', due: fmtD(ak) };
  }
  if (st === NB) return o['Причина відмови'] ? null : { key: 'noreason', due: addDays(0) };
  if (st === '8. Проведено') return null;
  if (stored && FLOW[stored].sts.includes(st)) return { key: stored, due: nc || addDays(0), time: tm };
  const r0 = stepDefault(o, st, nc, tm); if (r0) r0.auto = 1; return r0;
}
function stepDefault(o, st, nc, tm) {
  const pd = parseD(o['Дата свята']);
  const pn = pd ? Math.round((pd - today0()) / 864e5) : null;
  const shift = n => { const x = new Date(pd); x.setDate(x.getDate() + n); return fmtD(x); };
  switch (st) {
    case '': case '1. Нова': return { key: 'first', due: nc || addDays(0), time: tm };
    case '2. Уточнення': case '3. Пропозиція': return { key: 'n1', due: nc || addDays(0), time: tm };
    case '4. Дзвінок': return { key: 'call', due: nc || addDays(0), time: tm };
    case '5. Очікує оплату': return { key: 'pay', due: nc || addDays(0), time: tm };
    case '6. Заброньовано':
      if (pn === null) return { key: 'confirm', due: nc || addDays(0) };
      if (pn >= 1) return { key: 'eve', due: shift(-1), time: '17:00' };
      if (pn === 0) return { key: 'morning', due: fmtD(pd), time: '09:30' };
      return String(o['Залишок отримано']).trim() === 'Так' ? { key: 'after', due: shift(3) } : { key: 'rest', due: addDays(0) };
    case '7. Після свята': return { key: 'after', due: pd ? shift(3) : (nc || addDays(0)) };
    case '9. Відкладено': return { key: 'later', due: nc || addDays(0), time: tm };
  }
  return null;
}
const flagOf = o => { const l = String(o['Коментар'] || '').split('\n')[0].trim(); return /^⚑/.test(l) ? l.replace(/^⚑\s*(ЮЛІЇ:?)?\s*/i, '') : ''; };

/* ====== ЗАПИС КРОКУ В ТАБЛИЦЮ ======
   Одна зміна рядка: статус, крок, дата й час контакту, інші поля, рядок історії в «Коментар», позначка ⚑ */
function stamp() { const d = new Date(); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + (S.who && S.who !== 'Команда' ? ' ' + S.who : ''); }
function commit(o, r, label) {
  const want = {};
  if (r.st !== undefined && r.st !== o['Статус']) want['Статус'] = r.st;
  if (r.step !== undefined && hasStepCol()) want['Крок'] = r.step ? FLOW[r.step].label : '';
  if (r.step && !r.noDate) {
    const nd = r.date || addDays(r.in || 0);
    want['Наступний контакт'] = nd;
    want['Час контакту'] = r.time || '';
  }
  Object.assign(want, r.set || {});
  let c = String(o['Коментар'] || '');
  const lines = c.split('\n');
  const flagged = /^⚑/.test((lines[0] || '').trim());
  if (r.flag !== undefined || (r.st && r.st !== o['Статус'] && flagged && !r.keepFlag)) {
    if (flagged) lines.shift();
    if (r.flag) lines.unshift('⚑ ЮЛІЇ: ' + r.flag);
    c = lines.join('\n');
  }
  if (r.note) c = [c.trim(), stamp() + ': ' + r.note].filter(Boolean).join('\n');
  if (c !== String(o['Коментар'] || '')) want['Коментар'] = c;
  const changes = {};
  Object.keys(want).forEach(h => { if (col(h) > -1 && String(want[h]) !== String(o[h] || '')) changes[h] = { from: o[h] || '', to: want[h] }; });
  if (!Object.keys(changes).length) return;
  enqueue({ action: 'update', nomer: o['№'], sheet: o._sheet, changes, label: label || 'крок' });
}
const nextTxt = r => {
  if (!r.step) return '';
  const nd = r.date || addDays(r.in || 0); const n = daysTo(nd);
  return FLOW[r.step].label + ', ' + (n <= 0 ? 'сьогодні' : n === 1 ? 'завтра' : WEEKDAYS[parseD(nd).getDay()] + ' ' + nd.slice(0, 5)) + (r.time ? ' о ' + r.time : '');
};

/* ====== СЬОГОДНІ ====== */
function dueBadge(s) {
  const n = daysTo(s.due); const t = s.time ? ' о ' + esc(s.time) : '';
  if (n === null || n === 0) return `<span class="nc pink">сьогодні${t}</span>`;
  if (n < 0) return `<span class="nc red">прострочено ${-n} ${dayWord(n)}</span>`;
  if (n === 1) return `<span class="nc dim">завтра${t}</span>`;
  return `<span class="nc dim">${WEEKDAYS[parseD(s.due).getDay()]} ${esc(s.due.slice(0, 5))}${t}</span>`;
}
function flowItems() {
  return allRecs().map(o => ({ o, s: stepOf(o) })).filter(x => x.s);
}
function taskCard(x) {
  const { o, s } = x; const fl = FLOW[s.key]; const flag = flagOf(o);
  const who = [o["Ім'я клієнта"] || 'Без імені', o['Іменинник'] ? o['Іменинник'] + (o['Вік'] ? ', ' + o['Вік'] : '') : ''].filter(Boolean).join(' · ');
  const canAns = !!ansSet(o, s.key);

    ${o['Коментар'] ? `<div class="cm">${esc(lastLine(o['Коментар']))}</div>` : ''}
    <div class="fa"><button type="button" class="main" data-flow="${esc(o['№'])}">${esc(main)}</button>${canAns ? `<button type="button" data-ans="${esc(o['№'])}">Відповіла</button>` : '<span></span>'}<button type="button" class="more" data-more="${esc(o['№'])}" aria-label="Інше">⋯</button></div>
  </article>`;
}
R.today = () => {
  if (!S.data) return topMain() + '<div class="load">Завантажую…</div>' + navHtml('today');
  const now = new Date();

/* ====== ЕКРАН КРОКУ: тексти і «Надіслала» ====== */
function firstKey(o) {
  const c = String(o['Оголошення'] || '') + ' ' + String(o['Коментар'] || '');
  const age = Number(digits(o['Вік'])) || 0;
  const mine = phones(o['Контакт']).map(x => x.toLowerCase());
  const rep = allRecs().some(x => Number(x['№']) !== Number(o['№']) && (x._sheet === 'Клієнти' || x['Статус'] === '8. Проведено') && phones(x['Контакт']).some(p => mine.includes(p.toLowerCase())));
  if (rep || o['Джерело'] === 'Повторний') return 'repeat';
  if (age && age < 8) return 'under8';
  if (age === 8) return 'f8';
  if (age === 9) return 'f9';
  if (/10[–-]12/.test(c)) return 'f1012';
  if (/13[–-]14/.test(c)) return 'f1314';
  if (/дізнатися більше|дізнатись більше/i.test(c)) return 'fmore';

  return 'fmore';
}
function tplKeysFor(o, key) {

    : `<div class="note ok"><b>${esc(d)} вільне</b><span class="mute">На цей день немає заявок «5. Очікує оплату» і «6. Заброньовано».</span></div>`;

R.flow = () => {

<div class="body"><h2 tabindex="-1">${esc(fl.label)}</h2><p class="lead">${esc(fl.what)}</p>

</div>
<div class="dock">${fl.next ? `<button class="btn" type="button" data-fdone="${esc(o['№'])}">${esc(fl.send)}</button>` : ''}${(fl.alt || []).map((a, i) => `<button class="btn2" type="button" data-falt="${i}">${esc(a[0])}</button>`).join('')}</div>`;
};

/* ====== ВІДПОВІДЬ КЛІЄНТКИ ======

const ANS = {

/* ====== ЗВІТ ======

function period(k) {
  const t = today0();
  const mon = d => { const x = new Date(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
  if (k === 'week') { const a = mon(t); const b = new Date(a); b.setDate(a.getDate() + 6); return [a, b, 'Цей тиждень']; }
  if (k === 'lastweek') { const a = mon(t); a.setDate(a.getDate() - 7); const b = new Date(a); b.setDate(a.getDate() + 6); return [a, b, 'Минулий тиждень']; }
  if (k === 'month') return [new Date(t.getFullYear(), t.getMonth(), 1), new Date(t.getFullYear(), t.getMonth() + 1, 0), 'Цей місяць'];
  return [new Date(t.getFullYear(), t.getMonth() - 1, 1), new Date(t.getFullYear(), t.getMonth(), 0), 'Минулий місяць'];
}
const hm = x => { const m = String(x || '').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
function replyMin(r) {   // хвилини до першої відповіді в робочих годинах 9:00–20:00
  let a = hm(r.req), b = hm(r.resp);
  if (a === null || b === null) return null;
  if (a >= 20 * 60 || a < 9 * 60) a = 9 * 60;   // звернення поза робочим часом рахуємо від 9:00
  if (b < a) b += 24 * 60;
  return Math.max(0, b - a);
}
function computeReport() {
  const [a, b, label] = period(S.rep);
  const inP = s => { const d = parseD(s); return d && d >= a && d <= b; };
  const all = allRecs().filter(o => o['Статус'] !== 'Помилково внесено');
  const reqs = all.filter(o => inP(o['Дата звернення']));
  const src = { 'Реклама': 0, 'Рекомендації': 0, 'Повторні': 0, 'Сайт (квіз)': 0, 'Інше': 0 };
  reqs.forEach(o => { const j = o['Джерело'] || ''; src[/^Реклама/i.test(j) ? 'Реклама' : /Рекоменд/i.test(j) ? 'Рекомендації' : /Повтор/i.test(j) ? 'Повторні' : /Сайт|квіз/i.test(j) ? 'Сайт (квіз)' : 'Інше']++; });
  const n = o => { const x = parseInt(o['Статус'], 10); return isNaN(x) ? 0 : x; };
  const offered = reqs.filter(o => n(o) >= 3 && n(o) <= 8);
  const paid = reqs.filter(o => Number(digits(o['Передоплата, грн'])) > 0 || [6, 7, 8].includes(n(o)));
  const tk = reqs.filter(o => o['Формат'] === 'Під ключ');
  const reasons = {};
  reqs.filter(o => n(o) === 10).forEach(o => { const r = o['Причина відмови'] || 'без причини'; reasons[r] = (reasons[r] || 0) + 1; });
  const topR = Object.entries(reasons).sort((x, y) => y[1] - x[1]).slice(0, 3);
  const std = paid.filter(o => o['Формат'] !== 'Під ключ' && Number(digits(o['Чек, грн'])) > 0).map(o => Number(digits(o['Чек, грн'])));
  const avg = std.length ? Math.round(std.reduce((x, y) => x + y, 0) / std.length) : 0;
  const rm = ((S.data && S.data.replies) || []).filter(r => inP(r.date)).map(replyMin).filter(x => x !== null).sort((x, y) => x - y);
  const med = rm.length ? rm[Math.floor((rm.length - 1) / 2)] : null;
  const parties = all.filter(o => inP(o['Дата свята']) && [5, 6, 7, 8].includes(n(o)));
  const sum = h => parties.reduce((x, o) => x + (Number(digits(o[h])) || 0), 0);
  const pct = (x, y) => y ? Math.round(x * 100 / y) + '%' : '—';
  return { label, a, b, reqs, src, offered, paid, tk, topR, avg, med, rmN: rm.length, parties, partySum: sum('Чек, грн'), partyPre: sum('Передоплата, грн'), pct };
}

      const steps = newSteps(); const st = steps[P.i];
      if (d.act !== 'skip' && !validate(st.f)) return;
      const ni = d.act === 'jump' ? steps.findIndex(s => s.k === 'next') : P.i + 1;
      const fresh = newSteps();
      if (P.fromSum && d.act !== 'jump') { go('summary', {}); return; }
      if (ni >= fresh.length) go('summary', {}); else go('step', { mode: 'new', i: ni });
      break;
    }
    case 'save': saveNew(); break;
    case 'status': case 'nextc': openEdit(d.act); break;
    case 'after-next': P.after = d.v; render(true); break;
    case 'save-edit': saveEdit(); break;
  }
});
view.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in) {
    const h = t.dataset.in;
    let v = t.value;
    if (F[h] && F[h].t === 'money') { const dg = digits(v); const m = money(dg); if (t.value !== m) { t.value = m; } v = dg; if (h === 'Чек, грн') META.autoCheck = null; }
    if (F[h] && F[h].t === 'num') { v = digits(v); if (t.value !== v) t.value = v; }
    if (h === 'Склад програми') META.autoSklad = null;
    D[h] = v;
    if (String(v).trim()) clearErr(h);
    if (h === "Ім'я клієнта" && META.auto) META.auto.name = '';
    if (h === 'Instagram' && String(v).trim()) clearErr('Контакт');
    refreshInfo(h);
    saveDraft();
  }
});
view.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.date) { D[t.dataset.date] = isoToD(t.value); render(true); saveDraft(); }
  else if (t.dataset.in === 'Початок') { render(true); }
  else if (t.dataset.in === 'Instagram') { onContactRepeat(); refreshInfo('Instagram'); saveDraft(); }
  else if (t.dataset.in === 'Контакт') {
    if (META.contactType !== 'nick') { const n = normPhone(t.value); if (n !== t.value) { t.value = n; D['Контакт'] = n; } }
    onContactRepeat(); refreshInfo('Контакт'); saveDraft();
  }
});

/* ====== СТАРТ ====== */
(function init() {
  try { history.replaceState({ n: 1 }, ''); } catch (e) {}
  if (!S.pin) { STACK.push({ name: 'pin', params: {} }); show('pin', {}); return; }
  STACK.push({ name: 'today', params: {} });
  show('today', {});
  load(!!S.data);
  setTimeout(flush, 1500);
})();
</script>
